name: Java Client CI

on:
  push:
    paths:
      - "javaclients/**"
      - ".github/workflows/java-ci.yaml"
  pull_request:
    paths:
      - "javaclients/**"
      - ".github/workflows/java-ci.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: javaclients/pom.xml

      - name: Maven 构建与测试
        run: mvn -B -f javaclients/pom.xml verify
